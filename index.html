<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>영어 지문 노트</title>
<style>:root{--bg:#F3F6FB;--card:#fff;--ink:#16233B;--mut:#5C6980;--line:#DAE1EE;--blue:#2457E6;--blue-soft:#E4ECFF;--mark:#FFE45C;--film:#F3B9B6;--film-ink:#A8322E;--ok:#1C8A57;--ok-soft:#DDF3E8;--bad:#CC3B36;--bad-soft:#FBE3E1;--warn:#B7791F;--warn-soft:#FFF1CF}
@media(prefers-color-scheme:dark){:root{--bg:#0E1523;--card:#162033;--ink:#E7ECF6;--mut:#9BA8C0;--line:#263249;--blue:#86A6FF;--blue-soft:#1D2B4D;--mark:rgba(255,214,10,.34);--film:#5A2A30;--film-ink:#FFB4AE;--ok:#52D197;--ok-soft:#14352A;--bad:#FF7B74;--bad-soft:#40201F;--warn:#F0B84F;--warn-soft:#3B2F12}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;min-height:38px}
button:active{transform:scale(.98)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
@media(prefers-color-scheme:dark){button.pri{color:#0E1523}}
button.ghost{background:transparent}
button.sm{min-height:30px;padding:3px 10px;font-size:13px;border-radius:8px}
#app{max-width:720px;margin:0 auto;padding:0 16px calc(86px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;padding:16px 0 10px}
.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em;flex:1}
.top .back{min-height:34px;padding:4px 10px}
h2{font-size:13px;color:var(--mut);margin:22px 0 8px;font-weight:600}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
#nav button{flex:1;border:0;border-radius:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;color:var(--mut);font-size:12px;min-height:56px}
#nav button.on{color:var(--blue);font-weight:700}
#nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;gap:3px;margin:6px 0 12px}
.seg button{flex:1;border:0;background:transparent;min-height:34px;padding:4px 6px;border-radius:8px;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px}
/* passage list */
.plist{display:flex;flex-direction:column}
.prow{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;border-radius:0;padding:12px 2px;min-height:60px}
.prow .pt{font-weight:700;font-size:15.5px}
.prow .pk{font-size:12px;color:var(--blue);margin-left:6px;font-weight:600}
.prow .ps{display:block;color:var(--mut);font-size:13px;margin-top:1px}
.prow .pbar{display:block;height:4px;background:var(--line);border-radius:2px;margin:7px 0 3px;overflow:hidden}
.prow .pbar i{display:block;height:100%;background:var(--ok)}
.prow .pm{font-size:12px;color:var(--mut)}
/* sentences */
.sent{padding:12px 0 12px 12px;border-bottom:1px solid var(--line);border-left:3px solid transparent;margin-left:-3px}
.sent.know{border-left-color:var(--ok)}
.sent.unsure{border-left-color:var(--warn)}
.sent.flash{animation:fl 1.6s}
@keyframes fl{0%,60%{background:var(--blue-soft)}100%{background:transparent}}
.en{font-family:Georgia,"Noto Serif","Times New Roman",serif;font-size:17.5px;line-height:1.72}
.ko{font-size:14px;color:var(--mut);margin-top:5px;line-height:1.6;border-radius:6px}
.mode-hide .sent{cursor:pointer}
.mode-hide .sent:not(.open) .ko,.film{color:transparent;background:var(--film);position:relative;user-select:none;min-height:30px}
.mode-hide .sent:not(.open) .ko::after,.film::after{content:"탭해서 해석 보기";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--film-ink);font-size:12.5px;font-weight:600}
.mode-hide .sent:not(.open) .mkrow,.mode-hide .sent:not(.open) .gn{display:none}
mark.vw{background:linear-gradient(transparent 52%,var(--mark) 52%);color:inherit;border-radius:2px;cursor:pointer;padding:0 1px}
.mk-chip{display:inline-block;font:700 11px/1 -apple-system,"Apple SD Gothic Neo",sans-serif;background:var(--blue-soft);color:var(--blue);border-radius:5px;padding:3px 6px;margin-right:6px;vertical-align:2px}
.mkrow{display:flex;gap:6px;margin-top:8px}
.mkrow button{min-height:28px;padding:2px 10px;font-size:12.5px;border-radius:14px;color:var(--mut)}
.mkrow button.on[data-v=know]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.mkrow button.on[data-v=unsure]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:700}
.gn{margin-top:8px;padding:8px 10px;background:var(--blue-soft);border-radius:8px;font-size:13px;color:var(--ink)}
.gn p{margin:0}.gn p+p{margin-top:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 6px;font-size:13px;color:var(--mut)}
.toolbar label{display:flex;align-items:center;gap:5px;min-height:30px}
.toolbar .sp{flex:1}
.sticky{position:sticky;top:0;background:var(--bg);z-index:5;padding-top:env(safe-area-inset-top)}
/* card mode */
.bigcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px;margin:8px 0;min-height:260px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:14px}
.bigcard .en{font-size:21px}
.bigcard .ko{font-size:15px;margin:0;min-height:48px}
.cnav{display:flex;gap:8px;margin-top:10px}.cnav button{flex:1}
.cnt{text-align:center;color:var(--mut);font-size:13px}
.empty{padding:28px 8px;text-align:center;color:var(--mut)}
/* vocab popup */
#pop{position:fixed;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#pop[hidden]{display:none}
#pop b{font-size:17px;font-family:Georgia,serif}
#pop span{flex:1}
#pop button{background:transparent;color:inherit;border-color:rgba(255,255,255,.3);min-height:32px;padding:2px 10px}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:13px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
/* vocab list in study */
.vlist{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:14px}
.vlist div{padding:4px 0;border-bottom:1px solid var(--line)}
.vlist b{font-family:Georgia,serif}
.cta{display:block;width:100%;margin-top:22px;min-height:46px}
/* quiz */
.sel{width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:6px 10px;margin-bottom:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.qhead{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--mut);margin-bottom:6px}
.qhead .qno{background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 8px;font-weight:700}
.qhead .qpid{margin-left:auto}
.qstem{font-weight:700;margin-bottom:8px}
.qbody{font-family:Georgia,"Noto Serif",serif;font-size:16px;line-height:1.75;background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.qbody p{margin:0 0 8px}.qbody p:last-child{margin:0}
.qbody .given{font-weight:700;border:1px dashed var(--mut);border-radius:8px;padding:6px 8px;margin-bottom:8px}
.qbody .pos{font:700 13px -apple-system,sans-serif;color:var(--blue);white-space:nowrap}
.qbody .sum{border-top:1px dashed var(--mut);padding-top:8px;margin-top:8px}
.blank{display:inline-block;min-width:120px;border-bottom:2px solid var(--ink);margin:0 3px;height:1em;vertical-align:-2px}
.choices{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ch{width:100%;text-align:left;padding:10px 12px;font-size:15px;line-height:1.45}
.ch.pick{border-color:var(--blue);background:var(--blue-soft)}
.ch.right{border-color:var(--ok);background:var(--ok-soft);font-weight:600}
.ch.wrong{border-color:var(--bad);background:var(--bad-soft)}
.poschoices{display:flex;gap:6px}.poschoices .ch{text-align:center;padding:10px 0}
.qfoot{display:flex;gap:8px;margin-top:10px}.qfoot button{flex:1}
.exp{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px;background:var(--blue-soft)}
.exp.ok{background:var(--ok-soft)}.exp.no{background:var(--bad-soft)}
.res{font-weight:700;margin-bottom:4px}
.bi{border:0;border-bottom:2px solid var(--blue);background:transparent;border-radius:0;font:inherit;font-family:Georgia,serif;font-size:17.5px;text-align:center;padding:0 2px;min-width:3em;color:var(--ink)}
.bi.ok{border-color:var(--ok);color:var(--ok);font-weight:700}
.bi.bad{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.ans{font-size:13px;color:var(--bad);margin-top:6px}
.ordbox{min-height:44px;border:1px dashed var(--line);border-radius:10px;padding:6px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.tile{width:100%;text-align:left;font-family:Georgia,serif;font-size:15px;line-height:1.5;padding:8px 10px}
.tile .n{display:inline-block;background:var(--blue);color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center;font:700 12px sans-serif;margin-right:6px}
.tile.right{border-color:var(--ok);background:var(--ok-soft)}.tile.wrong{border-color:var(--bad);background:var(--bad-soft)}
.pool{display:flex;flex-direction:column;gap:6px}
.note{font-size:12.5px;color:var(--mut);margin:6px 0}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field label{font-size:13px;color:var(--mut)}
.field input,.field select{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:8px 10px;min-height:42px;width:100%}
.err{color:var(--bad);font-size:13.5px;margin:8px 0;white-space:pre-wrap}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
/* vocab tab */
.vi{padding:10px 0;border-bottom:1px solid var(--line)}
.vi .vt{display:flex;align-items:center;gap:8px}
.vi .vt b{font:700 18px Georgia,serif}
.vi .vm{flex:1;color:var(--ink);font-size:15px}
.hidem .vi .vm{color:transparent;background:var(--film);border-radius:5px;min-height:22px}
.hidem .vi .vm.show{color:var(--ink);background:transparent}
.vi .vs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
.chip{font-size:11.5px;padding:2px 8px;min-height:24px;border-radius:12px;color:var(--blue);background:var(--blue-soft);border-color:transparent}
.sp1{flex:1}
.flash2{background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;cursor:pointer;margin:10px 0}
.flash2 .w{font:700 30px Georgia,serif}
.flash2 .m{font-size:20px;min-height:30px}
.flash2 .s{font-size:12.5px;color:var(--mut)}
.mc{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.big{font:700 28px Georgia,serif;text-align:center;margin:18px 0 8px}
.score{text-align:center;padding:20px 0}.score b{font-size:34px}
.spellin{width:100%;min-height:48px;font-size:20px;text-align:center;border:2px solid var(--line);border-radius:12px;background:var(--card);padding:6px;font-family:Georgia,serif}
.prog{height:4px;background:var(--line);border-radius:2px;margin:6px 0 10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--blue)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.exp{white-space:pre-line;line-height:1.6}
details.lec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:6px 0;padding:0 12px}
details.lec summary{cursor:pointer;padding:11px 0;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between}
details.lec summary::after{content:"+";color:var(--mut);font-weight:400}
details.lec[open] summary::after{content:"–"}
details.lec[open]{padding-bottom:8px}
.lb{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.lb b{display:block;margin-bottom:3px}
.lb p{margin:2px 0;color:var(--ink)}
.fl{padding:8px 0;border-top:1px solid var(--line)}
.fl .fe{font:14.5px/1.55 Georgia,"Noto Serif",serif;margin-top:4px}
.fl .fk{font-size:13px;color:var(--mut);margin-top:2px}

.hint-ko{font:14px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--mut);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
body.hideko .hint-ko{display:none}
</style></head>
<body>
<div id="app"></div>
<div id="pop" hidden></div><div id="toast"></div>
<nav id="nav">
<button data-tab="study" class="on"><svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v15H5.5A1.5 1.5 0 0 0 4 20.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v15h5.5a1.5 1.5 0 0 1 1.5 1.5z"/></svg>지문 공부</button>
<button data-tab="quiz"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14 7l3 3"/></svg>문제 풀이</button>
<button data-tab="vocab"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M7 3h10M8 11h8M8 15h5"/></svg>단어 공부</button>
</nav>
<script>const TEXTBOOK = [
{
 id:"tb-0", title:"교과서 L3 · 도입", sub:"Korea’s Heritage Recognized Abroad", kind:"Read On",
 s:[
  ["Korean pop culture is loved all over the world under the name “Korean Wave.”","한국 대중문화는 ‘한류’라는 이름으로 전 세계에서 사랑받는다."],
  ["Korean pop music has topped global music charts.","한국 대중음악은 세계적인 음악 차트에서 1위를 차지했다."],
  ["Korean films and TV shows attract fans from across the globe.","한국 영화와 TV 프로그램은 전 세계 팬들의 마음을 끈다."],
  ["Now, beyond pop culture, the world is starting to pay attention to Korea’s traditional culture.","이제 대중문화를 넘어, 세계가 한국의 전통문화에 관심을 갖기 시작하고 있다."],
  ["Let’s take a look at some Korean heritage recognized abroad.","해외에서 인정받은 한국의 유산을 살펴보자."]
 ],
 v:[["heritage","유산"],["attract","마음을 끌다"],["pay attention to","~에 관심을 갖다"]],
 g:[
  [0,"수동태 is loved: ‘사랑받는다’. under the name “…”: ~라는 이름으로."],
  [1,"현재완료 has topped: 과거에 1위를 차지한 결과가 현재까지 이어짐."],
  [3,"to pay attention: start의 목적어로 쓰인 to부정사(명사적 용법). pay attention to + 명사: ~에 관심을 갖다."],
  [4,"과거분사구 후치수식: some Korean heritage {recognized abroad} = heritage [which is recognized abroad]. 명사와 수동 관계 → 과거분사. (능동 관계면 현재분사: a boy singing)"]
 ],
 q:[
  {kind:"내용 일치",q:"윗글의 내용과 일치하지 않는 것은?",
   choices:["한국 대중문화는 ‘한류’라는 이름으로 전 세계에서 사랑받는다.","한국 대중음악은 세계적인 음악 차트에서 1위를 차지했다.","한국 영화와 TV 프로그램은 전 세계 팬들의 마음을 끈다.","세계가 한국의 전통문화에도 관심을 갖기 시작하고 있다.","한국의 전통문화는 이미 대중문화보다 더 큰 인기를 얻고 있다."],
   a:4,exp:"본문은 세계가 전통문화에 ‘관심을 갖기 시작하고 있다’고만 했고, 대중문화보다 더 인기라는 말은 없다."},
  {kind:"어법",q:"빈칸에 들어갈 말로 가장 적절한 것은?",b:{rep:[["recognized","__BLANK__"]]},
   choices:["recognized","recognizing","which recognized","to recognize","being recognizing"],a:0,
   exp:"heritage는 ‘인정받는’ 대상이므로 수동 관계 → 과거분사 recognized가 뒤에서 수식한다."}
 ]
},
{
 id:"tb-1", title:"교과서 L3 · 한지", sub:"Hanji, a Rising Star of the Louvre", kind:"Read On",
 s:[
  ["In Europe, paper is used for the restoration of cultural assets.","유럽에서는 종이가 문화재의 복원에 사용된다."],
  ["For example, paper can be used to repair the damaged areas of paintings and other things made of paper.","예를 들어, 종이는 그림과 종이로 만들어진 다른 물건의 손상된 부분을 수선하는 데 사용될 수 있다."],
  ["It can also bring new life to decaying furniture and sculptures by filling in the cracks.","또한 갈라진 틈을 메움으로써 부패하는 가구와 조각품에 새로운 생명을 불어넣을 수 있다."],
  ["For such purposes, the Japanese paper called washi has been widely used.","그러한 목적으로 와시라고 불리는 일본 종이가 널리 사용되어 왔다."],
  ["The Louvre Museum in France was no exception.","프랑스의 루브르 박물관도 예외가 아니었다."],
  ["However, a Korean who was working at the Louvre in 2014 wanted to let the world know the value of hanji, traditional handmade Korean paper.","그러나, 2014년에 루브르 박물관에서 일하고 있던 한 한국인은 한국의 전통 수제 종이인 한지의 가치를 세계에 알리고 싶었다."],
  ["He convinced the head of the museum’s restoration team to read his study on the comparison of traditional papers from Korea and Japan.","그는 박물관 복원팀의 책임자를 설득하여 한국과 일본의 전통 종이의 비교에 관한 자신의 연구를 읽게 했다."],
  ["After reading his study, the Louvre became interested in hanji and carried out an experiment to see whether it would be suitable for use in restoration.","그의 연구를 읽은 후, 루브르 박물관은 한지에 관심을 갖게 되었고, 그것이 복원에 사용하기에 적합한지를 알아보기 위해 실험을 수행했다."],
  ["They wet both washi and hanji to compare their durability.","그들은 내구성을 비교하기 위해 와시와 한지를 적셨다."],
  ["Ultimately, hanji was found to be more durable than washi.","결국 한지가 와시보다 내구성이 더 강한 것으로 밝혀졌다."],
  ["Unlike washi, which has its fibers lined up in one direction, hanji is made with both horizontal and vertical fibers.","와시는 섬유들이 한 방향으로 배열되어 있는데 이와 달리, 한지는 가로와 세로로 된 섬유들로 만들어진다."],
  ["This means that the fibers in hanji are more closely woven, making the paper stronger.","이것은 한지의 섬유들이 더 촘촘하게 짜여 있어서 종이를 더 튼튼하게 만든다는 것을 의미한다."],
  ["This also allows hanji to maintain its original size and shape better when there is a change in its moisture content.","이것은 또한 수분 함량에 변화가 있을 때 한지가 원래의 크기와 모양을 더 잘 유지하도록 해준다."],
  ["Because of its durability, hanji was proven to be excellent material for restoration.","내구성으로 인해 한지가 복원에 우수한 재료임이 입증되었다."],
  ["Thus, in 2017, the Louvre used hanji for the first time to restore a relic from its collection.","그래서 2017년에 루브르 박물관은 소장품 가운데 유물 하나를 복원하기 위해 한지를 처음으로 사용했다."],
  ["Since then, hanji has been used more and more to restore various cultural assets of the museum.","그 이후로 한지는 루브르 박물관의 다양한 문화유산을 복원하는 데 점점 더 많이 사용되어 왔다."],
  ["Who knows?","누가 알겠는가?"],
  ["Maybe someday the Mona Lisa, one of the museum’s most famous paintings, will be restored with hanji.","언젠가는 루브르 박물관의 가장 유명한 그림 중 하나인 ‘모나리자’가 한지로 복원될지도 모른다."]

  ["Search for “Korean homi” on any online platform, and you can find reviews like these:","어떤 온라인 플랫폼에서든 ‘한국 호미’를 검색해 보라, 그러면 다음과 같은 리뷰를 찾을 수 있다:"],

  ["The Korean homi is becoming the hot new tool gardeners around the world must have.","한국의 호미는 전 세계의 정원 가꾸는 사람들이 반드시 가져야 하는 새로운 인기 도구가 되고 있다."],
  ["What is a homi and why is it so popular?","호미는 무엇이며 왜 이렇게 인기가 있을까?"],
  ["The Korean homi is a traditional farming tool that has gotten a lot of attention, not in Korea but in countries like the United States and Australia.","한국의 호미는 한국이 아닌 미국, 호주와 같은 나라에서 많은 관심을 받고 있는 전통 농기구이다."],
  ["In 2019, a video of how to use a homi spread quickly and widely on the Internet.","2019년에 호미 사용법에 관한 동영상이 인터넷에서 빠르게 널리 퍼졌다."],
  ["Suddenly, the homi had become one of the top selling gardening tools on the largest online shopping site in the world.","갑자기 호미는 세계 최대의 온라인 쇼핑 사이트에서 가장 많이 팔리는 원예 도구 중 하나가 되었다."],

  ["In fact, people in Europe and the U.S. use separate gardening tools to weed, dig, and firm the ground.","사실, 유럽과 미국 사람들은 잡초를 뽑고, 땅을 파고, 다지기 위해 별도의 원예 도구를 사용한다."],
  ["However, a homi has an ideal shape that makes all those activities possible with one tool.","그러나 호미는 이러한 모든 활동을 하나의 도구로 가능하게 하는 이상적인 모양을 가지고 있다."],
  ["Its thinnest blade is used for weeding, and the sharp point is used to dig the ground.","호미의 가장 얇은 날은 잡초를 뽑을 때 사용되고, 뾰족한 끝은 땅을 파는 데 사용된다."],

  ["As you see above, the reputation of Korean heritage is spreading throughout the world.","위에서 본 것처럼, 한국 유산의 명성이 전 세계로 퍼지고 있다."],

 s:[
  ["A classical ideal of truth and knowledge is the concept of a market for ideas: as thinking individuals, we encounter competing ideas, we evaluate them for their best fit to reality, and then let the best and brightest facts form the basis of our beliefs.","진리와 지식에 대한 고전적 이상은 아이디어를 위한 시장이라는 개념이다. 생각하는 개인으로서, 우리는 경쟁하는 아이디어들을 마주하고, 현실에 가장 잘 맞는지에 대해 그것들을 평가하며, 그러고 나서 가장 알맞고 뛰어난 사실들이 우리 신념의 기초를 형성하게 한다."],
  ["That would be the scientist’s way, in theory at least.","그것은, 적어도 이론상으로는, 과학자의 방식일 것이다."],
  ["But in practice, most of the time we are in a market for justifications.","그러나 실제로는, 대부분의 경우 우리는 ‘정당화를 위한 시장’에 있다."],
  ["We shop for words not because they contain ideas, but because they contain stories about ideas.","우리는 그것들이 아이디어들을 포함하고 있어서가 아니라, 그것들이 아이디어들에 관한 이야기들을 담고 있기 때문에 단어들을 쇼핑한다."],
  ["Often we are not seeking statements as facts to help us figure out what we should believe.","종종 우리는 우리가 무엇을 믿어야 할지 알아내는 데 도움을 줄 사실로서의 진술들을 찾고 있는 것이 아니다."],
  ["Usually we already know what we believe.","대개 우리는 우리가 무엇을 믿는지 이미 알고 있다."],

  ["Language might be good for this function but we can use it to do better.","언어는 이러한 기능에 좋을지 모르지만 우리는 더 잘하기 위해 그것(언어)을 사용할 수 있다."],

 g:[[3,"not because A, but because B: A 때문이 아니라 B 때문에."],[6,"What we seek: 관계대명사 what절이 주어. 보어가 복수(statements)라 동사는 are."]],

{id:"m-2",no:2,exam:"6월 24번",kind:"제목",sub:"소셜 미디어 스크롤 중 발생하는 도파민 급증과 급락의 신경학적 기전",
 s:[
  ["Let’s look at what is occurring in your brain when scrolling on social media, a quick dopamine activity.","소셜 미디어상에서 스크롤할 때 당신의 뇌에서 일어나고 있는 일, 즉 빠른 도파민 활동을 살펴보자."],
  ["You open your social media apps and immediately you notice you feel really good, your dopamine levels increase incredibly fast and pleasure is experienced in your brain.","당신은 소셜 미디어 앱을 열고 당신이 정말 기분이 좋다는 것을 즉시 알아차리게 되며, 당신의 도파민 수치는 믿을 수 없이 빠르게 증가하여 쾌락이 뇌에서 경험된다."],
  ["The challenge this creates is as with everything in our universe: as the laws of physics explain, ‘what goes up, must come down’.","이것(도파민 급증)이 만들어 내는 난제는 우리 우주의 모든 것들과 마찬가지이다. 즉, 물리학 법칙이 설명하듯이, ‘올라가는 것은, 반드시 내려와야 한다.’"],
  ["Your brain and body are always seeking something called ‘homeostasis’, which simply means balance.","당신의 뇌와 몸은 ‘항상성’이라고 불리는 어떤 것을 항상 추구하고 있는데, 그것은 단순히 균형을 의미한다."],
  ["With this in mind, when dopamine levels increase incredibly fast when scrolling social media, the brain then thinks, ‘Wow, how are my dopamine levels so high?’","이것을 염두에 두고, 소셜 미디어를 스크롤할 때 도파민 수치가 믿을 수 없이 빠르게 증가하면, 뇌는 그때 ‘와, 내 도파민 수치가 어떻게 이렇게 높지?’라고 생각한다."],
  ["In order to achieve homeostasis, or balance, the dopamine then has to quickly drop an equal amount below your baseline level in order to rebalance, making you feel even worse than before you started scrolling.","항상성, 즉 균형을 이루기 위해서, 그때 도파민은 다시 균형을 맞추기 위해 당신의 기준선 수치 아래로 동일한 양만큼 빠르게 떨어져야 하고, 스크롤을 시작하기 전보다 당신을 훨씬 더 기분이 나쁘게 만든다."]
 ],
 v:[["immediately","즉시"],["incredibly","믿을 수 없이"],["physics","물리학"],["baseline","기준선"],["homeostasis","항상성"]],
 g:[[3,"계속적 용법 , which: 앞의 ‘homeostasis’에 대한 추가 설명."],[5,"분사구문(결과) , making you feel …: = and it makes you feel …. make + 목적어 + 원형부정사(feel)."]],
 q:[{kind:"제목",q:"다음 글의 제목으로 가장 적절한 것은?",
  choices:["The Dopamine Seesaw: How Scrolling Makes You Feel","Stop Blaming Social Media for All Your Problems!","Tips for Regaining Balance from Social Media","Dopamine: The Motivator to Take Action","The More Scrolling, the Less Interaction"],a:0,
  exp:"도파민이 빠르게 오르면 균형을 위해 기준선 아래로 떨어진다는 ‘오르내림’ 구조 → 시소(Seesaw)."}]},

{id:"m-3",no:3,exam:"6월 29번",kind:"어법",sub:"인간의 경험을 담아내는 문학의 지속적인 힘",
 s:[
  ["Literature, in its essence, is a testament to the enduring power of human creativity and expression.","문학은, 본질적으로, 인간의 창의성 및 표현의 지속적인 힘에 대한 증거이다."],
  ["It transcends time and space, connecting us with the thoughts and emotions of people from all walks of life, across centuries and cultures.","그것은 시간과 공간을 초월하여, 수 세기 여러 문화에 걸쳐, 우리를 각계각층 사람들의 생각 및 감정과 연결해 준다."],
  ["Despite the rise of new technologies and the ever-changing landscape of media, literature has retained its relevance and significance as a timeless art form.","새로운 기술의 부상과 끊임없이 변화하는 미디어 환경에도 불구하고, 문학은 시대를 초월한 예술 형식으로서 그 적절성과 중요성을 유지해 왔다."],
  ["One reason for literature’s enduring power is its ability to capture and convey the complexities of the human experience.","문학의 지속적인 힘에 대한 한 가지 이유는 인간 경험의 복잡성을 포착하고 전달하는 그것(문학)의 능력이다."],
  ["Through the written word, authors have the unique ability to explore the depths of human emotion, the nuances of relationships, and the challenges and triumphs of the human spirit.","글을 통해, 작가들은 인간 감정의 깊이, 관계의 미묘한 차이, 그리고 인간 정신의 도전과 승리를 탐구하는 독특한 능력을 갖춘다."],
  ["Literature allows us to see ourselves reflected in the pages of a book, to empathize with characters different from ourselves, and to gain a deeper understanding of the human condition.","문학은 우리가 책의 페이지 속에 우리 자신이 투영되는 것을 보고, 우리 자신과는 다른 인물들에게 공감하며, 그리고 인간의 조건에 대한 더 깊은 이해를 얻도록 한다."]
 ],
 v:[["essence","본질"],["enduring","지속적인"],["walks of life","각계각층"],["retain","유지하다"],["relevance","적절성"],["significance","중요성"],["timeless","시대를 초월한"],["testament","증거"],["transcend","초월하다"],["nuance","미묘한 차이"]],
 g:[[1,"분사구문 connecting us with …: 주절과 동시 동작(결과). 능동이므로 현재분사."],[3,"to capture and (to) convey: ability를 수식하는 to부정사 병렬."],[4,"문장의 본동사는 have. having은 준동사라 동사 역할을 못 한다 → 어법상 틀린 부분(원문 시험에서는 ④ having)."],[5,"see + 목적어 + 과거분사: ourselves가 ‘투영되는’ 수동 관계 → reflected. allows us to see, (to) empathize, (to) gain 병렬."]],
 q:[{kind:"어법",pos:true,q:"다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?",
  b:{rep:[["connecting","① <u>connecting</u>"],["Despite","② <u>Despite</u>"],["convey","③ <u>convey</u>"],["authors have","authors ④ <u>having</u>"],["reflected","⑤ <u>reflected</u>"]]},
  choices:["①","②","③","④","⑤"],a:3,
  exp:"④ having → have. 주어 authors에 대한 본동사가 없다. ① 분사구문 ② Despite + 명사구 ③ to capture and (to) convey 병렬 ⑤ see + O + 과거분사."}]},

{id:"m-4",no:4,exam:"6월 31번",kind:"빈칸 추론",sub:"인간 존재 내에서 지속되는 눈에 보이지 않는 변화와 유동성",
 s:[
  ["Our world is not just interconnected, but ever-changing, even if we can’t sense it.","우리의 세계는 단지 서로 연결되어 있을 뿐만 아니라, 우리가 감지할 수 없다고 할지라도, 끊임없이 변화하고 있다."],
  ["While you’re reading this, you’re changing.","당신이 이것을 읽는 동안에도, 당신은 변하고 있다."],
  ["You’re aging (a minute amount, thankfully), but the neural networks in your brain are also imperceptibly changing as you perceive each word.","(다행히도, 아주 미세한 양으로) 당신은 나이 들고 있지만, 당신이 각각의 단어를 인식하는 동안 뇌의 신경망 또한 감지할 수 없게 변화하고 있다."],
  ["Crucially, even when we’re seemingly not doing anything of note, events are taking place outside your immediate surroundings that will change your life in the future, though you won’t realize it yet.","결정적으로, 우리가 겉보기에 주목할 만한 어떤 것도 하지 않는 것처럼 보일 때조차도, 당신의 직접적인 주변 환경 밖에서는 미래에 당신의 삶을 변화시킬 사건들이 일어나고 있지만, 당신은 아직 그것을 깨닫지 못할 것이다."],
  ["Heraclitus, the ancient Greek philosopher, rightly pointed out, “No man ever steps in the same river twice. For it’s not the same river and he’s not the same man.”","고대 그리스 철학자 Heraclitus는 “어떤 사람도 같은 강물에 두 번 발을 담글 수 없다. 왜냐하면 그것은 같은 강물이 아니며 그는 같은 사람이 아니기 때문이다.”라고 정확히 지적했다."],
  ["To that, Cratylus, a student of Heraclitus, added that we are not mere passive observers.","이에 대해, Heraclitus의 제자인 Cratylus는 우리는 단순한 수동적인 관찰자가 아니라고 덧붙였다."],
  ["When you step in a river, you change it.","당신이 강물에 발을 담그면, ‘당신’이 그것을 변화시킨다."],
  ["Nothing is static.","정적인 것은 아무것도 없다."],
  ["Even microscopic changes add up over time.","극히 작은 변화들조차 시간이 지나면서 쌓인다."]
 ],
 v:[["sense","감지하다"],["minute","미세한"],["perceive","인식하다"],["seemingly","겉보기에"],["microscopic","극히 작은"],["neural","신경(계)의"],["imperceptibly","감지할 수 없게"],["static","정적인"]],
 g:[[5,"not mere ~: 단순한 ~이 아닌. added that …: 접속사 that절."]],
 q:[{kind:"빈칸 추론",q:"다음 빈칸에 들어갈 말로 가장 적절한 것은?",b:{rep:[["passive observers","__BLANK__"]]},
  choices:["effective leaders","passive observers","accurate predictors","sensitive dreamers","influential philosophers"],a:1,
  exp:"강물에 발을 담그면 ‘당신이 강물을 변화시킨다’. 즉 우리는 변화를 그저 지켜보는 수동적 관찰자가 아니다."}]},

{id:"m-5",no:5,exam:"6월 32번",kind:"빈칸 추론",sub:"학습과 기억 회상에 미치는 환경적 다양성의 긍정적 영향",
 s:[
  ["Do you always study in the same spot?","항상 같은 장소에서 공부하는가?"],
  ["Don’t.","그러지 마라."],
  ["If you study in different places, that helps create variety, and that rich experience can reinforce what you are learning.","여러 장소에서 공부하면, 그것은 다양성을 만들도록 돕고, 그러한 풍부한 경험은 당신이 학습하고 있는 것을 강화할 수 있다."],
  ["When several college students told us they did school work in different places rather than in some favorite nook, that habit reflected the research on learning.","몇몇 대학생들이 좋아하는 어떤 구석진 곳에서보다는 여러 장소에서 학교 과제를 한다고 우리에게 말했을 때, 그 습관은 학습에 관한 연구를 반영했다."],
  ["Numerous experiments have found that if learners simply study in at least two different places, they are more likely to recall the material.","수많은 실험은 학습자가 최소 두 곳 이상의 다른 장소에서 단지 공부하기만 해도, 학습 자료를 기억할 가능성이 더 높다는 것을 발견했다."],
  ["In one of the first such trials, two different groups studied a list of words.","그러한 초기 실험들 중 하나에서 두 개의 다른 집단이 하나의 단어 목록을 공부하였다."],
  ["Some students returned to the same room twice while their counterparts spent the same amount of time divided between two locations.","일부 학생들은 같은 방으로 두 번 돌아왔지만, 상대 집단은 두 장소에서 동일하게 나뉜 시간을 보냈다."],
  ["When asked to recall as many words on the list as possible, those who had moved around did far better.","목록에 있는 가능한 한 많은 단어를 기억해 보라고 요청받았을 때, 장소를 옮겨 다닌 학생들이 훨씬 더 잘했다."],
  ["Variety creates rich association, even when those connections form in the background, totally outside of what we are consciously thinking.","다양성은 풍부한 연상을 만들어 내는데, 이러한 연결들이 배경에서, 즉 우리가 의식적으로 생각하고 있는 것의 완전히 바깥에서, 형성될 때조차도 (그러하다)."]
 ],
 v:[["association","연상"],["variety","다양성, 변화"],["reinforce","강화하다"],["reflect","반영하다"],["numerous","수많은"],["trial","실험, 시도"],["nook","구석진 곳"],["counterpart","상대"]],
 g:[[4,"be likely to + 동사원형: ~할 가능성이 높다. have found that …: 현재완료 + that절."],[7,"When asked …: When (they were) asked의 분사구문(주어·be동사 생략). those who had moved around: 과거완료(요청받은 시점보다 앞선 행동)."]],
 q:[{kind:"빈칸 추론",q:"다음 빈칸에 들어갈 말로 가장 적절한 것은?",b:{rep:[["recall the material","__BLANK__"]]},
  choices:["recall the material","worsen their learning habits","develop anxiety and depression","create diverse networks of people","remember the features of the places"],a:0,
  exp:"장소를 옮겨 다니며 공부한 학생들이 단어를 훨씬 더 잘 기억했다. 즉 학습한 내용을 더 잘 recall한다."}]},

{id:"m-6",no:6,exam:"6월 33번",kind:"빈칸 추론",sub:"후각적 경험을 언어로 표현하고 식별하는 것의 어려움",
 s:[
  ["Talking about what something smells like is the most basic way of talking about our olfactory experience, and even this most basic way of talking about smells is challenging.","어떤 것이 무슨 냄새가 나는지에 관해 이야기하는 것은 우리의 후각 경험에 관해 이야기하는 가장 기본적인 방식인데, 냄새에 관해 이야기하는 이 가장 기본적인 방식조차도 어렵다."],
  ["There are no words in the English language to describe smells in the same way in which “blue” or “green” describe colors.","영어에는 ‘파랑’이나 ‘초록’이 색을 묘사하는 것과 같은 방식으로 냄새를 묘사하는 단어가 없다."],
  ["Instead, to talk about how something smells, we talk about the source of the odor.","대신, 어떤 것의 냄새가 어떤지에 관해 이야기하기 위해서, 우리는 그 냄새의 근원에 관해 이야기한다."],
  ["Things smell “flowery,” “fruity,” or “fishy.”","사물들은 ‘꽃 같은’, ‘과일 같은’, 또는 ‘생선 같은’ 냄새가 난다."],
  ["Furthermore, even the most familiar odors are difficult to identify when they are not experienced in their usual context.","게다가, 가장 익숙한 냄새조차도 일상의 맥락에서 경험되지 않을 때는 식별하기 어렵다."],
  ["In one experiment the majority of participants was unable to name very common odors like beer, urine, roses, or motor oil.","한 실험에서 참가자 대다수는 맥주, 소변, 장미, 또는 모터 오일 같은 매우 흔한 냄새의 이름을 댈 수 없었다."],
  ["Obviously, even those who couldn’t name any of these odors would drink the beer but not the urine or the motor oil.","분명하게, 이 냄새들 중 어떤 것도 이름을 대지 못한 사람들조차도 맥주는 마셔도 소변이나 모터 오일은 마시지 않을 것이다."],
  ["This is how evolution has shaped our brain: We respond to odors correctly in many different ways, but we are not well-equipped to talk about them.","이것이 진화가 우리 뇌를 형성해 온 방식이다. 우리는 여러 다른 방식으로 냄새에 정확하게 반응하지만, 그에 대해 이야기할 채비가 잘 되어 있지 않다(능력이 잘 갖추어져 있지 않다)."]
 ],
 v:[["odor","냄새"],["identify","식별하다"],["majority","다수"],["participant","참가자"],["evolution","진화"],["olfactory","후각의"],["urine","소변"]],
 g:[[1,"전치사 + 관계대명사: the same way in which = the same way that. “blue” or “green” describe colors."],[7,"This is how …: 이것이 ~한 방식이다. but 뒤의 we are not well-equipped to …가 빈칸 내용(말로 표현하는 능력 부족)."]],
 q:[{kind:"빈칸 추론",q:"다음 빈칸에 들어갈 말로 가장 적절한 것은? [3점]",b:{rep:[["we are not well-equipped to talk about them","__BLANK__"]]},
  choices:["we manage to identify their exact sources","we are not well-equipped to talk about them","our perceptions do not lead to strong emotions","we cannot distinguish them without visual information","these responses can be wrong without the usual context"],a:1,
  exp:"글 전체가 ‘냄새는 말로 표현·식별하기 어렵다’는 내용이다. 올바르게 반응하지만(but) 말로 이야기할 능력은 부족하다는 흐름."}]},

{id:"m-7",no:7,exam:"6월 34번",kind:"빈칸 추론",sub:"결과와 보상 평가를 통한 인간 행동의 적응",
 s:[
  ["A particularly powerful way in which human beings adapt and adjust to their circumstances is by changing behaviors in light of the consequences that they yield.","인간이 자신의 환경에 적응하고 맞춰가는 특히 강력한 방식은 그것(행동)들이 초래하는 결과에 비추어 행동을 바꾸는 것이다."],
  ["For instance, a child who gets praised by her teacher for doing an exercise correctly is likely to continue doing the exercise in that way.","예를 들어, 운동을 정확히 한 것에 대해 선생님에게 칭찬받는 아이는 그런 방식으로 운동을 계속할 가능성이 있다."],
  ["A dancer who feels that a particular conditioning exercise is not giving any results is likely to give that exercise up in favor of another one that seems more promising.","특정한 조건화 운동이 아무런 결과를 내지 못한다고 느끼는 무용수는 더 유망해 보이는 또 다른 운동을 (하기) 위해 그 운동을 포기할 가능성이 있다."],
  ["In general, we tend to do things that bring us some kind of benefit or act in ways that help us avoid some kind of problem, discomfort, or disadvantage.","일반적으로, 우리는 우리에게 어떤 종류의 이익을 가져다주는 일을 하거나 우리가 어떤 종류의 문제, 불편함, 또는 불이익을 피하도록 돕는 방식으로 행동하는 경향이 있다."],
  ["We also tend to do fewer things (or stop doing things) that lead to problems, discomfort, or disadvantages, and we tend to avoid acting in ways that do not bring any benefit or reward.","또한 우리는 문제, 불편함, 또는 불이익으로 이어지는 것들을 더 적게 하는 (또는 중단하는) 경향이 있으며, 어떤 이익이나 보상도 가져오지 않는 방식으로 행동하기를 피하는 경향이 있다."]
 ],
 v:[["adjust","맞추다"],["circumstance","환경, 상황"],["promising","유망한"],["yield","산출하다"],["in favor of","~을 위해"],["disadvantage","불이익"]],
 g:[[0,"by + 동명사(changing …). the consequences [that they yield]: 목적격 관계대명사절."],[2,"give up in favor of ~: ~을 위해 포기하다. 관계대명사 that절이 another one을 수식."]],
 q:[{kind:"빈칸 추론",q:"다음 빈칸에 들어갈 말로 가장 적절한 것은?",b:{rep:[["changing behaviors in light of the consequences","__BLANK__"]]},
  choices:["changing behaviors in light of the consequences","quitting things even after receiving the benefits","facing new challenges in spite of all the difficulties","doing exercises regardless of the possible outcomes","taking risks with the expectation of the financial profits"],a:0,
  exp:"칭찬받으면 계속하고 결과가 없으면 포기한다. 즉 행동의 결과(이익·보상)에 따라 행동을 바꾼다."}]},

{id:"m-8",no:8,exam:"6월 36번",kind:"글의 순서",sub:"빙하기 이후의 기후 변화와 농경의 등장",
 s:[
  ["During the Ice Age, not only was the planet much colder, with ice sheets covering much of what we call the northern hemisphere today, but, crucially, it was much drier.","빙하기 동안, 지구는, 오늘날 우리가 북반구라고 부르는 지역의 대부분을 얼음층이 뒤덮은 채로, 훨씬 더 추웠을 뿐만 아니라, 결정적으로, 훨씬 더 건조했다."],
  ["In Ireland, we often associate the cold with the wet but if it is really cold, there is far less evaporation, fewer clouds, and less rain.","아일랜드에서, 우리는 종종 추위를 습함과 연관 짓지만, 정말 춥다면, 증발 작용이 훨씬 더 적고, 구름도 더 적으며, 비도 더 적다.","(B)"],
  ["Our world in the Ice Age was cold and dry, meaning it was difficult for plants to grow.","빙하기의 우리 지구는 춥고 건조했는데, 이는 식물이 자라기 어렵다는 것을 의미했다."],
  ["In this type of climate, farming isn’t an option: it’s too risky to depend on any one piece of land to produce the energy you need.","이런 유형의 기후에서, 농사는 선택지가 아니다. 즉, 당신이 필요한 에너지를 생산하려고 어느 한 조각의 땅에 의존하는 것은 너무 위험하다.","(A)"],
  ["As the temperature rose and the ice caps melted, we experienced a sudden explosion of life.","온도가 상승하고 만년설이 녹으면서, 우리는 갑작스러운 생명의 폭발을 경험했다."],
  ["The world got warmer and wetter, and people started to live around places where they could make food grow most intensively.","지구는 더 따뜻하고 습해졌고, 그리고 사람들은 식량이 가장 집약적으로 자라게 할 수 있는 장소 주변에 살기 시작했다.","(C)"],
  ["This didn’t happen overnight; it probably took thousands of years, with hunter-gatherers foraging and hunting, while doing a little side hustle in farming.","이것은 하룻밤 사이에 일어나지 않았고, 수렵채집인들이, 농사로 부업을 조금씩 하는 동안, 채집과 사냥을 하면서, 그것은 아마도 수천 년이 걸렸을 것이다."]
 ],
 v:[["hemisphere","반구"],["explosion","폭발"],["associate","연관 짓다"],["intensively","집약적으로"],["hunter-gatherer","수렵채집인"],["evaporation","증발"],["forage","채집하다"],["side hustle","부업"]],
 g:[[0,"not only가 문두에 오면 도치: not only was the planet much colder (… but it was much drier). with + 명사 + 분사(ice sheets covering …): 부대상황."],[6,"with + 명사 + 분사(hunter-gatherers foraging and hunting): 부대상황 표현. while doing …: 접속사가 남은 분사구문."]],
 q:[{kind:"글의 순서",q:"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?",b:{order:{given:[0],A:[3,4],B:[1,2],C:[5,6]}},
  choices:["(A) - (C) - (B)","(B) - (A) - (C)","(B) - (C) - (A)","(C) - (A) - (B)","(C) - (B) - (A)"],a:1,
  exp:"주어진 글(춥고 건조) → (B) 추위와 건조함 설명, 식물이 자라기 어려움 → (A) 이런 기후에서는 농사 불가, 기온 상승 → (C) 따뜻하고 습해져 농경 시작."}]},

{id:"m-9",no:9,exam:"6월 37번",kind:"글의 순서",sub:"작업 기억과 장기 기억 간의 상호작용 및 인지적 차이",
 s:[
  ["The big difference between working and long-term memory is that we are explicitly aware of the information in working memory, but we are not able to directly access the information in our long-term memory.","작업 기억과 장기 기억의 큰 차이는 우리가 작업 기억에 있는 정보는 명시적으로 인식하지만, 장기 기억에 있는 정보에는 직접 접근할 수 없다는 것이다."],
  ["We access long-term memory by bringing the information into working memory.","우리는 정보를 작업 기억으로 불러옴으로써 장기 기억에 접근한다.","(C)"],
  ["For example, right now you are not aware of all the actors you have ever seen.","예를 들어, 지금 당장 당신은 당신이 본 적 있는 모든 배우들을 인식하고 있지 않다."],
  ["They are stored in your long-term memory outside your consciousness.","그들은 당신의 의식 밖의 장기 기억에 저장되어 있다."],
  ["However, if I asked you to list all the actors, you would use your working memory to retrieve them one by one and reel them off.","하지만, 만약 내가 당신에게 모든 배우들을 열거하라고 요청하면, 당신은 작업 기억을 활용해 그들을 하나씩 생각해 내서 술술 말하게 될 것이다.","(B)"],
  ["Your working memory can access your long-term memory and bring those memories to awareness.","당신의 작업 기억은 장기 기억에 접근하여 그 기억들을 인식으로 가져올 수 있다."],
  ["But remember it has a limit of seven items or chunks.","하지만 그것은 7개 항목 또는 덩어리라는 한계가 있다는 것을 기억하라.","(A)"],
  ["Each actor would be an item.","각 배우는 하나의 항목이 될 것이다."],
  ["Try and hold all the actors you know in your explicit awareness.","당신이 아는 모든 배우를 당신의 명시적 인식 속에 떠올리려고 해보라."],
  ["You might try to visualize a large group of them.","당신은 그들을 하나의 큰 무리로 시각화하려고 노력할지도 모른다."],
  ["But you still would only be aware of a few actors at any one time.","하지만 당신은 여전히 한 번에 몇몇 배우만을 인식할 뿐이다."]
 ],
 v:[["explicitly","명시적으로",["explicit"]],["chunk","덩어리"],["access","접근하다"],["visualize","시각화하다"],["awareness","인식, 의식"],["consciousness","의식"],["retrieve","생각해 내다"],["reel off","술술 말하다"]],
 g:[[0,"the difference between A and B is that ~: A와 B의 차이는 ~라는 것이다. be able to + 동사원형."],[4,"가정법 과거(if I asked …, you would use …). to retrieve: 목적의 to부정사."]],
 q:[{kind:"글의 순서",q:"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?",b:{order:{given:[0],A:[6,7,8,9,10],B:[4,5],C:[1,2,3]}},
  choices:["(A) - (C) - (B)","(B) - (A) - (C)","(B) - (C) - (A)","(C) - (A) - (B)","(C) - (B) - (A)"],a:4,
  exp:"주어진 글 → (C) 장기 기억은 작업 기억으로 불러와 접근, 배우 예시 → (B) However, 배우를 열거하라고 하면 작업 기억을 사용 → (A) But, 작업 기억의 한계(7개)."}]},

{id:"m-10",no:10,exam:"6월 38번",kind:"문장 삽입",sub:"정보 부호화 및 기억 회상을 향상시키는 제스처의 역할",
 s:[
  ["If you gesture while describing an event, do you think you’ll be able to recall that event better than if you don’t?","만약 당신이 어떤 사건을 묘사하면서 제스처를 한다면, 제스처를 하지 않는 경우보다 그 사건을 더 잘 기억해 낼 수 있을 거라고 생각하는가?"],
  ["We had adults watch videos of toy objects, animals, and people performing various, sometimes odd, actions: a chicken sliding to a policeman, a jogger bending down to touch his toes, a fence swinging shut on its own.","우리는 성인들에게 다양한, 때로는 기이한, 행동을 하는 장난감 물체, 동물, 그리고 사람들의 영상을 시청하게 했는데, (예를 들면) 경찰관에게로 미끄러지는 닭, 몸을 굽혀 발끝을 만지는 조깅하는 사람, 저절로 흔들리며 닫히는 울타리였다."],
  ["We then tested the adults’ memories of these events immediately after the descriptions and three weeks later.","그 다음에 우리는 이 사건들에 대한 그 성인들의 기억을 (그 사건들에 대한) 묘사 직후와 3주 후에 테스트했다."],
  ["Adults who were told to gesture while describing the events remembered more than adults who were told not to gesture, particularly several weeks later.","사건을 묘사하면서 제스처를 하라고 들은 성인들은 제스처를 하지 말라고 들은 성인들보다 더 많은 것을 기억했으며, 특히 몇 주 후에 (더 그러했다).","주어진 문장"],
  ["To see if we’d get the same effects if people gestured on their own, we did the study again, but this time we gave the adults no instructions about gesture.","사람들이 스스로 제스처를 하는 경우에도 동일한 결과를 얻을 수 있는지 확인하기 위해, 우리는 연구를 다시 수행했지만, 이번에는 성인들에게 제스처에 관해 아무런 지시도 하지 않았다."],
  ["We found the same patterns: people remembered items on which they had gestured spontaneously better than items on which they had not gestured.","우리는 동일한 양상을 발견했다. 즉, 사람들은 자발적으로 제스처를 했던 항목들을 제스처를 하지 않았던 항목들보다 더 잘 기억했다."],
  ["Producing gesture along with speech makes the information encoded in that speech memorable.","말과 함께 제스처를 하는 것은 그 말 속에 부호화된 정보를 기억할 만하게 만든다."]
 ],
 v:[["odd","기이한"],["bend","구부리다"],["particularly","특히"],["instruction","지시"],["spontaneously","자발적으로"],["encode","부호화하다"]],
 g:[[1,"사역동사 have + 목적어 + 원형부정사(watch). 현재분사구 performing …이 people 등을 수식."],[3,"who were told to gesture: 수동태 + to부정사. 비교 구문 more than …"],[5,"전치사 + 관계대명사: items on which they had gestured. 과거완료(비교 시점보다 앞선 행동)."]],
 q:[{kind:"문장 삽입",pos:true,q:"글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?",b:{ins:{given:3,after:[0,1,2,4,5]}},
  choices:["①","②","③","④","⑤"],a:2,
  exp:"주어진 문장은 ‘제스처를 하라고 지시받은 집단’의 결과이다. 실험 설명과 기억 테스트(We then tested …) 다음인 ③에 오고, 이어서 ‘지시 없이’ 한 후속 실험(To see if …)으로 자연스럽게 연결된다."}]},

{id:"m-11",no:11,exam:"6월 39번",kind:"문장 삽입",sub:"삼림 파괴가 탄소 조절과 지구 온난화에 미치는 영향",
 s:[
  ["Approximately 15-20% of global greenhouse gas emissions are caused by degradation and deforestation.","전 세계 온실가스 배출의 약 15-20%는 환경 악화와 삼림 벌채로 인해 비롯된다."],
  ["Trees play a huge role in the carbon cycle.","나무들은 탄소 순환에서 막대한 역할을 한다."],
  ["They convert the CO2 in the air to oxygen through the process of photosynthesis, and consequently, they are viewed as a natural regulator of carbon dioxide.","그것들은 광합성 과정을 통해 공기 중의 이산화탄소를 산소로 전환하며, 그 결과, 이산화탄소의 자연적인 조절자로 여겨진다."],
  ["The existence of a larger amount of trees will no doubt lead to the reduced presence of carbon dioxide in the atmosphere and the increased existence of oxygen.","더 많은 양의 나무의 존재는 의심할 여지 없이 대기 중 이산화탄소의 감소와 산소의 증가로 이어질 것이다."],
  ["Unfortunately, deforestation is preventing this process from being fully accomplished.","불행하게도, 삼림 벌채는 이러한 과정이 온전히 이루어지는 것을 막고 있다.","주어진 문장"],
  ["And with half of the Earth’s forests gone, the amount of carbon dioxide is progressively rising.","그리고 지구 삼림의 절반이 사라지면서, 이산화탄소의 양은 점점 증가하고 있다."],
  ["With more carbon dioxide in the atmosphere, more of the sun’s radiation is being reflected back to Earth instead of being released into space, and this is causing the planet’s average temperature to rise.","대기 중 이산화탄소가 더 많아지면서, 더 많은 태양 복사 (에너지)가 우주로 방출되는 대신 지구로 다시 반사되고 있으며, 이는 지구의 평균 기온이 상승하도록 유발하고 있다."],
  ["Accordingly, deforestation is a major issue when it comes to global warming.","따라서, 삼림 벌채는 지구 온난화와 관련하여 주요한 문제이다."]
 ],
 v:[["deforestation","삼림 벌채"],["emission","배출"],["convert","전환하다"],["oxygen","산소"],["accordingly","따라서"],["progressively","점진적으로"],["degradation","(환경) 악화"],["photosynthesis","광합성"],["radiation","복사 (에너지)"]],
 g:[[2,"be viewed as ~: ~로 여겨지다 (view A as B의 수동태)."],[4,"prevent A from -ing: A가 ~하는 것을 막다. 여기서는 수동 being fully accomplished. this process는 앞 문장의 나무가 CO2를 줄이는 과정."],[5,"with + 명사 + 과거분사(with half of the forests gone): 부대상황."]],
 q:[{kind:"문장 삽입",pos:true,q:"글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?",b:{ins:{given:4,after:[1,2,3,5,6]}},
  choices:["①","②","③","④","⑤"],a:2,
  exp:"나무가 CO2를 줄이고 산소를 늘린다는 ‘과정’을 설명한 뒤, Unfortunately로 삼림 벌채가 그 과정을 방해한다고 전환한다. 이어지는 ‘삼림의 절반이 사라지면서 CO2 증가’와 자연스럽게 연결되는 곳이 ③."}]},

{id:"m-12",no:12,exam:"6월 40번",kind:"요약문",sub:"무의식적인 감정적 의사결정과 그에 따르는 이성적 정당화",
 s:[
  ["We go out in the world every day and make decisions about what is safe or not and what is appropriate or not.","우리는 매일 세상으로 나가 무엇이 안전한지 아닌지 그리고 무엇이 적절한지 아닌지에 대한 결정을 내린다."],
  ["It is what psychologist Joseph LeDoux has suggested is an unconscious “danger detector” that determines whether or not something or someone is safe before we can even begin to consciously make a determination.","우리가 의식적으로 판단하기를 시작하기도 전에 어떤 것이나 사람이 안전한지 아닌지를 판단하는 것은 바로 심리학자 Joseph LeDoux가 제안한 무의식적인 ‘위험 감지기’라는 것이다."],
  ["When the object, animal, or person is assessed to be dangerous, a fear response, which has been called “fight or flight,” occurs.","사물, 동물, 또는 사람이 위험하다고 평가될 때, 공포 반응이 발생하는데, 그것은 ‘싸움 또는 도피’라고 불러 왔다."],
  ["On a conscious level we may correct a mistake in this “danger detector” when we notice it, but often, of course, we simply begin to generate reasons for why it was accurate in the first place.","의식적 수준에서는 우리가 이 ‘위험 감지기’의 오류를 발견했을 때 그것을 수정할 수 있을지 모르지만, 종종, 당연히, 우리는 그것이 애초에 왜 정확했는지에 대한 이유를 그저 만들어내기 시작한다."],
  ["We are generally convinced that our decisions are “rational,” but in reality, most human decisions are made emotionally, and then we collect or generate the facts to justify these decisions.","우리는 일반적으로 자신의 결정이 ‘이성적’이라고 확신하지만, 실제로는, 대부분의 인간 결정은 감정적으로 이루어지고, 그 후에 이러한 결정을 정당화할 사실을 모으거나 만들어낸다."],
  ["When we see something or someone who “feels” dangerous, we have already launched into action internally before we have even started “thinking.”","위험하다고 ‘느껴지는’ 어떤 것이나 사람을 볼 때, 우리는 심지어 ‘생각’을 시작하기도 전에 이미 내면적으로 행동을 시작해 버린다."],
  ["We perform an automatic assessment of danger before conscious thinking, making emotion-based decisions first and then generating reasons to support them.","우리는 의식적인 사고에 앞서 위험에 대한 자동적인 평가를 수행하는데, 감정에 기반한 결정들을 먼저 내리고 나서 그것들을 뒷받침할 이유들을 만들어낸다.","요약문"]
 ],
 v:[["rational","이성적인"],["launch","시작하다"],["assess","평가하다"],["accurate","정확한"]],

 q:[{kind:"요약문",q:"다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?",

{id:"m-13",no:13,exam:"6월 41-42번",kind:"장문 독해",sub:"스포츠 관중 수와 수익을 견인하는 불확실성의 힘",
 s:[
  ["Commercial businesses aim for predictability and certainty, especially when it comes to product quality.","상업적 기업은, 특히 제품 품질에 있어, 예측 가능성과 확실성을 추구한다."],
  ["But predictability and certainty are not always valued in the sporting world, especially when it comes to the delivery of professional sport competitions.","그러나 예측 가능성과 확실성이 스포츠계, 특히 프로 스포츠 경기 운영에서는 항상 가치 있게 여겨지지는 않는다."],
  ["From a spectator’s perspective the sport experience is better experienced when unpredictable.","관중의 관점에서 스포츠 경험은 예측 불가능할 때 더 잘 경험된다."],
  ["Sport events actually depend on that unpredictability in order to attract people to the game.","실제로 스포츠 경기는 사람들을 경기로 끌어들이기 위해 그 예측 불가능성에 의존한다."],
  ["When the results of games cannot be predicted, attendances at sporting contests are likely to be higher, as are the profits of leagues.","경기 결과가 예측될 수 없을 때, 스포츠 경기의 관중은 더 늘어날 가능성이 있으며, 리그의 수익도 그렇다."],
  ["However, the presence of predictability also leads to significant variability in the quality of sporting performances.","그러나, 예측 가능성의 존재(→ 결여)는 또한 스포츠 수행(실적)의 질에 있어 상당한 변동성으로 이어진다."],
  ["Many factors can contribute to the variability of the sport product, including the weather, player injuries, the venue, the quality of the opponents, the closeness of the scores and even the size of the crowd.","날씨, 선수 부상, 경기장, 상대 팀의 실력, 점수의 근접성과 심지어 관중의 규모를 포함하여, 많은 요인들이 스포츠 상품의 변동성의 원인이 될 수 있다."],
  ["A cricket match can be exhilarating, boring or even frustrating, but fans still have to pay the same price.","크리켓 경기는 짜릿할 수도, 지루할 수도, 심지어 좌절감을 줄 수도 있지만, 팬들은 여전히 동일한 가격을 지불해야 한다."],
  ["Sport marketers may attempt to overcome this by ‘improving’ the product in systematic ways, such as including a star player, offering premium seating or providing other forms of entertainment and inviting facilities.","스포츠 마케팅 담당자들은 스타 선수 영입, 프리미엄 좌석 제공 또는 다른 형태의 오락거리와 편의 시설 제공과 같이, 체계적인 방식으로 (스포츠) 상품을 ‘개선’함으로써 이를 극복하려 시도할지 모른다."],
  ["The uncertain nature of sport contests is just one element of a total experience, although it is an important element for financial success.","스포츠 경기의 불확실한 속성은 전체 경험의 단지 한 요소일 뿐이지만, 재정적 성공을 위한 중요한 요소이다."]
 ],
 v:[["perspective","관점"],["facility","시설",["facilities"]],["predictability","예측 가능성",["unpredictable","unpredictability"]],["certainty","확실성"],["attendance","관중 수, 참석"],["variability","가변성, 변동성"],["opponent","(경기의) 상대"],["systematic","체계적인"],["spectator","관중"],["venue","(스포츠 경기 등의) 장소"],["exhilarating","짜릿한"]],

   b:{rep:[["valued","(a) <u>valued</u>"],["attract","(b) <u>attract</u>"],["presence","(c) <u>presence</u>"],["overcome","(d) <u>overcome</u>"],["financial","(e) <u>financial</u>"]]},

   exp:"불확실성은 관중과 수익을 늘리는 장점이지만, 품질 변동성이라는 도전 과제도 낳는다. 두 면을 모두 담은 것은 ‘축복이자 도전’."},
  {kind:"어휘",pos:true,q:"밑줄 친 (a) ∼ (e) 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은? [42번]",

<script>(function(){

const CIRC=["①","②","③","④","⑤"];
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const attr=s=>esc(s).replace(/"/g,"&quot;");

/* ---------- storage ---------- */

Object.keys(S.wrong||{}).forEach(k=>{if(!S.wrong[k]||S.wrong[k].kind!=="mcq")delete S.wrong[k];});
let st_t;function save(){clearTimeout(st_t);st_t=setTimeout(()=>{try{localStorage.setItem("esite.v1",JSON.stringify(S));}catch(e){}},120);}

/* ---------- data ---------- */
const P=[].concat(TEXTBOOK.map(p=>Object.assign({group:"tb"},p)),MOCK.map(p=>Object.assign({group:"mock",title:"모의고사 "+p.no+"번"},p)));
P.forEach(p=>{
  const L=(typeof LEC!=="undefined")&&LEC[p.id];if(!L)return;
  if(L.v){const have={};p.v.forEach(x=>have[x[0].toLowerCase()]=1);L.v.forEach(x=>{if(!have[x[0].toLowerCase()]){p.v.push(x);have[x[0].toLowerCase()]=1;}});}
  if(L.g)p.g=L.g;
  if(L.exp&&p.q&&p.q[0])p.q[0].exp=L.exp;
  if(L.lec)p.lec=L.lec;
});
function makeMatcher(vocab){
  const terms=[];
  vocab.forEach((v,i)=>[v.w].concat(v.forms||[]).forEach(t=>terms.push({t:t.toLowerCase(),i})));
  if(!terms.length)return null;
  terms.sort((a,b)=>b.t.length-a.t.length);
  const src="\\b(?:"+terms.map(x=>x.t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\w*";
  return {src,find(m){const l=m.toLowerCase();for(const x of terms)if(l.startsWith(x.t))return x.i;return -1;}};
}
P.forEach(p=>{
  p.sents=p.s.map(a=>({en:a[0],ko:a[1],mark:a[2]||""}));
  p.vocab=p.v.map(a=>({w:a[0],m:a[1],forms:a[2]||[]}));
  p.gram={};(p.g||[]).forEach(a=>{(p.gram[a[0]]=p.gram[a[0]]||[]).push(a[1]);});
  p.qs=p.q||[];
  p.m=makeMatcher(p.vocab);
});
const byId={};P.forEach(p=>byId[p.id]=p);
function hl(p,text){
  const e=esc(text);if(!p.m)return e;
  return e.replace(new RegExp(p.m.src,"gi"),m=>{const i=p.m.find(m);return i<0?m:'<mark class="vw" data-v="'+i+'">'+m+'</mark>';});
}

const ui={tab:"study",

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1600);}
function speak(w){try{const u=new SpeechSynthesisUtterance(w);u.lang="en-US";speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function sentState(pid,i){return S.sent[pid+":"+i]||"";}
function pOptions(sel){

  return g("tb","교과서")+g("mock","모의고사");
}
function wrongCount(){return Object.keys(S.wrong).length;}

function render(top){

function mcqQ(item){return item.ai?item.ai:byId[item.pid].qs[item.qi];}
function buildBody(p,b){
  const E=i=>esc(p.sents[i].en);
  if(!b)return "<p>"+p.sents.map((_,i)=>E(i)).join(" ")+"</p>";
  if(b.order){const o=b.order,j=a=>a.map(E).join(" ");return '<p class="given">'+j(o.given)+'</p><p><b>(A)</b> '+j(o.A)+'</p><p><b>(B)</b> '+j(o.B)+'</p><p><b>(C)</b> '+j(o.C)+'</p>';}
  if(b.ins){const out=[];p.sents.forEach((_,i)=>{if(i===b.ins.given)return;out.push(E(i));const n=b.ins.after.indexOf(i);if(n>=0)out.push('<span class="pos">( '+CIRC[n]+' )</span>');});return '<div class="given">'+E(b.ins.given)+'</div><p>'+out.join(" ")+'</p>';}
  let t=p.sents.map((_,i)=>(b.excl&&b.excl.indexOf(i)>=0)?null:E(i)).filter(x=>x!==null).join(" ");
  (b.rep||[]).forEach(r=>{t=t.replace(esc(r[0]),()=>r[1]);});
  t=t.replace(/__BLANK__/g,'<span class="blank"></span>');
  return "<p>"+t+"</p>"+(b.append?'<p class="sum">'+b.append+'</p>':"");
}

/* drills: 자동 생성 문제도 모두 5지선다 */
function mkMC(pid,key,kind,q,html,choices,ans,exp){return {kind:"mcq",pid:pid,key:key,ai:{kind:kind,q:q,body:html,html:true,choices:choices,a:ans,exp:exp}};}
function genBlanks(p,n){
  const terms=[];p.vocab.forEach(v=>[v.w].concat(v.forms||[]).forEach(t=>terms.push(t.toLowerCase())));
  const cand=[];
  if(p.m)p.sents.forEach((s,si)=>{const rx=new RegExp(p.m.src,"gi");let m;const r=[];while((m=rx.exec(s.en))){if(terms.indexOf(m[0].toLowerCase())>=0)r.push([m.index,m.index+m[0].length]);}if(r.length)cand.push({si:si,r:r});});
  const pool=vocabAll().map(o=>o.w);
  return rnd(cand).slice(0,n).map(c=>{
    const t=rnd(c.r)[0],s=p.sents[c.si].en,ans=s.slice(t[0],t[1]),al=ans.toLowerCase();
    const cap=x=>/[A-Z]/.test(ans[0])?x.charAt(0).toUpperCase()+x.slice(1):x;
    let dis=rnd(p.vocab.map(v=>v.w).filter(w=>w.toLowerCase()!==al)).slice(0,4);
    if(dis.length<4)dis=dis.concat(rnd(pool.filter(w=>w.toLowerCase()!==al&&dis.indexOf(w)<0)).slice(0,4-dis.length));
    const opts=rnd(dis.map(cap).concat([ans]));
    const vi=p.m.find(ans),mean=vi>=0?p.vocab[vi].m:"";
    const html="<p>"+esc(s.slice(0,t[0]))+'<span class="blank"></span>'+esc(s.slice(t[1]))+'</p><div class="hint-ko">'+esc(p.sents[c.si].ko)+"</div>";
    return mkMC(p.id,"b:"+p.id+":"+c.si+":"+t[0],"빈칸 (어휘)","다음 빈칸에 들어갈 말로 가장 적절한 것은?",html,opts,opts.indexOf(ans),"정답: "+ans+(mean?" ("+mean+")":""));
  });
}
function genOrders(p,n){
  const N=p.sents.length,out=[],seen={};
  const perms=[["A","B","C"],["A","C","B"],["B","A","C"],["B","C","A"],["C","A","B"],["C","B","A"]].map(x=>"("+x[0]+") - ("+x[1]+") - ("+x[2]+")");
  const E=i=>esc(p.sents[i].en);
  for(let t=0;t<n*12&&out.length<n;t++){
    const g=(N>=7&&Math.random()<0.5)?2:1,w=1+3*g;
    if(N<w)continue;
    const st=Math.floor(Math.random()*(N-w+1));
    let ok=true;for(let i=st;i<st+w;i++)if(p.sents[i].en.split(" ").length<4&&t<n*8)ok=false;
    if(!ok)continue;
    const key="o:"+p.id+":"+st+":"+g;if(seen[key])continue;seen[key]=1;
    const groups=[0,1,2].map(k=>{const a=[];for(let j=0;j<g;j++)a.push(st+1+k*g+j);return a;});
    const labels=rnd(["A","B","C"]),by={};groups.forEach((gr,k)=>by[labels[k]]=gr);
    const correct="("+labels[0]+") - ("+labels[1]+") - ("+labels[2]+")";
    const wrongs=rnd(perms.filter(x=>x!==correct));wrongs.pop();
    const opts=perms.filter(x=>x===correct||wrongs.indexOf(x)>=0);
    const html='<p class="given">'+E(st)+"</p>"+["A","B","C"].map(L=>"<p><b>("+L+")</b> "+by[L].map(E).join(" ")+"</p>").join("");
    const exp="올바른 순서: "+correct+"\n원문 순서:\n"+Array.from({length:w},(_,k)=>(k+1)+". "+p.sents[st+k].en).join("\n");
    out.push(mkMC(p.id,key,"글의 순서","주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?",html,opts,opts.indexOf(correct),exp));
  }
  return out;
}

async function aiGen(){
  const z=ui.qz,p=byId[z.pid];
  S.key=($("#apikey")||{}).value||S.key;S.model=($("#aimodel")||{}).value||S.model;
  z.aiKind=$("#aikind").value;z.aiN=parseInt($("#ain").value,10);save();
  if(!S.key){z.aiErr="API 키를 먼저 입력해 주세요.";render();return;}
  z.aiBusy=true;z.aiErr="";render();
  const text=p.sents.map(s=>s.en).join(" ");
  const prompt="다음 영어 지문으로 대한민국 고등학교 1학년 모의고사 스타일의 5지선다 객관식 문제를 "+z.aiN+"개 만들어라.\n유형: "+z.aiKind+(z.aiKind==="혼합"?" (서로 다른 유형으로)":"")+"\n\n[지문]\n"+text+"\n\n규칙:\n- 문제 지시문(q)은 한국어 모의고사 말투로 쓴다. 예: 다음 빈칸에 들어갈 말로 가장 적절한 것은?\n- 빈칸, 밑줄, 문장 순서, 문장 삽입 위치, 요약문처럼 지문 형태가 필요한 유형은 body에 가공된 지문 전체를 넣는다. (삽입은 ( ① )~( ⑤ ) 표시, 순서는 (A)(B)(C) 단락, 어법/어휘는 ①~⑤ 밑줄 표시) 지문이 필요 없으면 body는 빈 문자열.\n- choices는 정확히 5개이며 번호 기호(①, 1.)를 붙이지 않는다.\n- answer는 정답 번호(1~5). 정답이 하나뿐인지 반드시 검증한다.\n- exp는 한국어 해설 2~3문장.\n- 출력은 JSON 배열만. 설명이나 코드블록 없이.\n스키마: [{\"kind\":\"빈칸 추론\",\"q\":\"...\",\"body\":\"...\",\"choices\":[\"\",\"\",\"\",\"\",\"\"],\"answer\":3,\"exp\":\"...\"}]";
  try{
    const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),90000);
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:ctl.signal,headers:{"content-type":"application/json","x-api-key":S.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:S.model,max_tokens:4000,system:"You output only valid JSON. No markdown, no commentary.",messages:[{role:"user",content:prompt}]})});
    clearTimeout(to);
    const d=await r.json();
    if(!r.ok)throw new Error((d&&d.error&&d.error.message)||("HTTP "+r.status));
    let t=(d.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("");
    t=t.replace(/```json|```/g,"");const a=t.indexOf("["),b=t.lastIndexOf("]");
    const arr=JSON.parse(t.slice(a,b+1));
    const qs=arr.filter(x=>x&&x.q&&Array.isArray(x.choices)&&x.choices.length===5&&x.answer>=1&&x.answer<=5).map(x=>({kind:x.kind||z.aiKind,q:x.q,body:x.body||"",choices:x.choices.map(String),a:x.answer-1,exp:x.exp||""}));
    if(!qs.length)throw new Error("문제 형식을 읽지 못했어요. 다시 시도해 주세요.");
    S.ai[p.id]={at:Date.now(),qs:qs};save();
  }catch(e){
    z.aiErr="문제를 만들지 못했어요: "+(e.name==="AbortError"?"시간이 초과됐어요.":e.message)+"\n(API 키, 모델 이름, 인터넷 연결을 확인해 주세요. 브라우저가 직접 호출을 막는 경우도 있어요.)";
  }
  z.aiBusy=false;render();
}

/* ================= VOCAB ================= */
function vocabAll(){
  if(ui._va)return ui._va;
  const m=new Map();
  P.forEach(p=>p.vocab.forEach(v=>{const k=v.w.toLowerCase();let o=m.get(k);if(!o){o={w:v.w,m:v.m,k:k,src:[]};m.set(k,o);}else if(o.m.indexOf(v.m)<0&&v.m.indexOf(o.m)<0)o.m+=" / "+v.m;if(o.src.indexOf(p.id)<0)o.src.push(p.id);}));
  return ui._va=Array.from(m.values());
}
function vocabFiltered(){
  const f=ui.vc.filter;let a=vocabAll();
  if(f==="tb")a=a.filter(o=>o.src.some(id=>byId[id].group==="tb"));
  else if(f==="mock")a=a.filter(o=>o.src.some(id=>byId[id].group==="mock"));
  else if(f==="know")a=a.filter(o=>S.vs[o.k]==="know");
  else if(f==="unsure")a=a.filter(o=>S.vs[o.k]==="unsure");
  else if(f==="wrong")a=a.filter(o=>S.vw[o.k]);
  else if(f.indexOf("p:")===0)a=a.filter(o=>o.src.indexOf(f.slice(2))>=0);
  return a;
}
function vmark(k){const s=S.vs[k]||"";return '<button class="sm'+(s==="know"?" ok":"")+'" data-act="vmark" data-k="'+attr(k)+'" data-v="know" style="'+(s==="know"?"border-color:var(--ok);color:var(--ok);font-weight:700":"")+'">외웠어요</button><button class="sm" data-act="vmark" data-k="'+attr(k)+'" data-v="unsure" style="'+(s==="unsure"?"border-color:var(--warn);color:var(--warn);font-weight:700":"")+'">헷갈려요</button>';}
function viewVocab(){
  const v=ui.vc,list=vocabFiltered(),all=vocabAll();
  let h='<div class="top"><h1>단어 공부</h1></div>';
  const fo=(val,label)=>'<option value="'+val+'"'+(v.filter===val?" selected":"")+'>'+label+'</option>';
  const pg=(grp,label)=>'<optgroup label="'+label+'">'+P.filter(p=>p.group===grp).map(p=>fo("p:"+p.id,esc(p.title)+(p.kind?" · "+esc(p.kind):""))).join("")+'</optgroup>';
  h+='<select class="sel" id="vfilter">'+fo("all","전체 ("+all.length+")")+fo("tb","교과서만")+fo("mock","모의고사만")+fo("unsure","헷갈려요 ("+all.filter(o=>S.vs[o.k]==="unsure").length+")")+fo("know","외웠어요")+fo("wrong","틀린 단어 ("+all.filter(o=>S.vw[o.k]).length+")")+pg("tb","교과서 지문별")+pg("mock","모의고사 지문별")+'</select>';
  h+='<div class="seg">'+[["list","목록"],["card","카드"],["mc","뜻 맞히기"],["spell","영단어 쓰기"]].map(m=>'<button data-act="vmode" data-m="'+m[0]+'" class="'+(v.mode===m[0]?"on":"")+'">'+m[1]+'</button>').join("")+'</div>';
  if(!list.length)return h+'<div class="empty">이 조건에 맞는 단어가 없어요.</div>';
  if(v.mode==="list"){
    h+='<div class="toolbar"><span>'+list.length+'개</span><span class="sp"></span><label><input type="checkbox" data-act="hidem" '+(v.hideM?"checked":"")+'> 뜻 가리기</label></div><div class="'+(v.hideM?"hidem":"")+'">';
    h+=list.map(o=>'<div class="vi"><div class="vt"><b>'+esc(o.w)+'</b><button class="sm ghost" data-act="speak" data-w="'+attr(o.w)+'" aria-label="발음">🔊</button><span class="vm" data-act="showm">'+esc(o.m)+'</span></div><div class="vs">'+o.src.map(id=>'<button class="chip" data-act="vjump" data-pid="'+id+'" data-w="'+attr(o.w)+'">'+esc(byId[id].title.replace("교과서 ","").replace("모의고사 ","모의 "))+'</button>').join("")+'<span class="sp1"></span>'+vmark(o.k)+'</div></div>').join("");
    return h+'</div>';
  }
  if(!v.ses||v.ses.mode!==v.mode||v.ses.filter!==v.filter)startSes();
  return h+sesView();
}
function startSes(keys){
  const v=ui.vc,list=vocabFiltered();
  const ks=keys||rnd(list.map(o=>o.k));
  v.ses={mode:v.mode,filter:v.filter,order:ks,i:0,flip:false,done:false,pick:null,fb:null,ok:0,bad:[]};
}
function vobj(k){return vocabAll().find(o=>o.k===k);}
function sesView(){
  const s=ui.vc.ses,n=s.order.length;
  if(!n)return '<div class="empty">단어가 없어요.</div>';
  if(s.done){return '<div class="score"><b>'+(s.mode==="card"?"끝!":s.ok+" / "+n)+'</b><p>'+(s.mode==="card"?"헷갈려요 "+s.bad.length+"개":"틀린 단어 "+s.bad.length+"개")+'</p><button class="pri" data-act="sesrestart">처음부터</button> '+(s.bad.length?'<button data-act="sesbad">틀린·헷갈린 것만</button>':"")+'</div>';}
  const o=vobj(s.order[s.i]);
  const prog='<div class="cnt">'+(s.i+1)+' / '+n+'</div><div class="prog"><i style="width:'+((s.i)/n*100)+'%"></i></div>';
  if(s.mode==="card"){
    return prog+'<div class="flash2" data-act="vflip"><div class="w">'+esc(o.w)+'</div>'+(s.flip?'<div class="m">'+esc(o.m)+'</div><div class="s">'+o.src.map(id=>esc(byId[id].title)).join(", ")+'</div>':'<div class="s">탭해서 뜻 보기</div>')+'<button class="sm ghost" data-act="speak" data-w="'+attr(o.w)+'">🔊</button></div><div class="cnav"><button data-act="vcard" data-v="unsure">헷갈려요</button><button class="pri" data-act="vcard" data-v="know">외웠어요</button></div>';
  }
  if(s.mode==="mc"){
    if(!s.q||s.q.k!==o.k){const pool=rnd(vocabAll().filter(x=>x.k!==o.k&&x.m!==o.m)).slice(0,3).map(x=>x.m);s.q={k:o.k,opts:rnd(pool.concat([o.m]))};}
    return prog+'<div class="big">'+esc(o.w)+' <button class="sm ghost" data-act="speak" data-w="'+attr(o.w)+'">🔊</button></div><div class="mc">'+s.q.opts.map((m,i)=>{const done=s.pick!==null;const c=done?(m===o.m?" right":(i===s.pick?" wrong":"")):"";return '<button class="ch'+c+'" data-act="vpick" data-i="'+i+'"'+(done?" disabled":"")+'>'+esc(m)+'</button>';}).join("")+'</div>'+(s.pick!==null?'<div class="qfoot"><button class="pri" data-act="vnext">다음</button></div>':"");
  }
  const fb=s.fb;
  return prog+'<div class="big" style="font-family:inherit;font-size:24px">'+esc(o.m)+'</div><input class="spellin" id="spell" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="영단어를 입력"'+(fb?" disabled":"")+' value="'+(fb?attr(fb.val):"")+'">'+(fb?'<div class="exp '+(fb.ok?"ok":"no")+'"><div class="res">'+(fb.ok?"정답!":"오답 — "+esc(o.w))+'</div></div><div class="qfoot"><button class="pri" data-act="vnext">다음</button></div>':'<div class="qfoot"><button class="pri" data-act="vspell">확인</button></div>');
}
function sesNext(){const s=ui.vc.ses;s.i++;s.flip=false;s.pick=null;s.fb=null;s.q=null;if(s.i>=s.order.length)s.done=true;render();}

/* ================= events ================= */
document.addEventListener("click",function(e){
  const t=e.target;
  const vw=t.closest&&t.closest("mark.vw");
  if(vw){const p=byId[ui.st.pid];const v=p.vocab[+vw.dataset.v];const pop=$("#pop");pop.innerHTML='<b>'+esc(v.w)+'</b><span>'+esc(v.m)+'</span><button data-act="speak" data-w="'+attr(v.w)+'">🔊</button><button data-act="popx">닫기</button>';pop.hidden=false;e.stopPropagation();return;}
  if(!t.closest("#pop"))$("#pop").hidden=true;
  const nav=t.closest("#nav button");if(nav){ui.tab=nav.dataset.tab;render(true);return;}
  const el=t.closest("[data-act]");
  if(!el){
    const sent=t.closest(".mode-hide .sent");if(sent){sent.classList.toggle("open");}
    return;
  }
  const a=el.dataset.act,p=ui.st.pid?byId[ui.st.pid]:null;
  switch(a){
   case "openp":ui.st.pid=el.dataset.pid;ui.st.mode="full";ui.st.ci=0;ui.st.copen=false;ui.st.cdone=false;ui.st.only=false;render(true);break;
   case "back":ui.st.pid=null;render(true);break;
   case "smode":ui.st.mode=el.dataset.m;ui.st.ci=0;ui.st.copen=false;ui.st.cdone=false;render();break;
   case "gram":ui.st.gram=el.checked;render();break;
   case "only":ui.st.only=el.checked;ui.st.ci=0;ui.st.cdone=false;render();break;
   case "openall":document.querySelectorAll(".mode-hide .sent").forEach(x=>x.classList.add("open"));break;
   case "closeall":document.querySelectorAll(".mode-hide .sent").forEach(x=>x.classList.remove("open"));break;
   case "mark":{
     const sent=el.closest(".sent"),i=sent.dataset.i,k=p.id+":"+i,v=el.dataset.v;
     if(S.sent[k]===v)delete S.sent[k];else S.sent[k]=v;save();
     const stt=S.sent[k]||"";sent.classList.remove("know","unsure");if(stt)sent.classList.add(stt);
     sent.querySelectorAll(".mkrow button").forEach(b=>b.classList.toggle("on",b.dataset.v===stt));
     break;}
   case "copen":ui.st.copen=!ui.st.copen;render();break;
   case "cmark":{
     const idx=p.sents.map((_,i)=>i).filter(i=>!ui.st.only||sentState(p.id,i)==="unsure");
     const i=idx[ui.st.ci],k=p.id+":"+i;S.sent[k]=el.dataset.v;save();
     if(ui.st.ci<idx.length-1){ui.st.ci++;ui.st.copen=false;}else ui.st.cdone=true;
     render();break;}
   case "cprev":if(ui.st.ci>0){ui.st.ci--;ui.st.copen=false;render();}break;
   case "cnext":{const idx=p.sents.map((_,i)=>i).filter(i=>!ui.st.only||sentState(p.id,i)==="unsure");if(ui.st.ci<idx.length-1){ui.st.ci++;ui.st.copen=false;render();}else{ui.st.cdone=true;render();}break;}
   case "creplay":ui.st.only=el.dataset.only==="1";ui.st.ci=0;ui.st.cdone=false;ui.st.copen=false;render(true);break;
   case "gotoquiz":ui.qz.pid=p.id;ui.qz.sub="preset";ui.tab="quiz";render(true);break;
   case "speak":speak(el.dataset.w);break;
   case "popx":$("#pop").hidden=true;break;
   /* quiz */
   case "qsub":ui.qz.sub=el.dataset.m;render();break;
   case "dmode":ui.qz.dm=el.dataset.m;render();break;
   case "hideko":S.hideKo=!el.checked;document.body.classList.toggle("hideko",!!S.hideKo);save();break;
   case "regen":delete ui.qz.drills[ui.qz.pid+":"+ui.qz.dm];render();break;
   case "choose":{const sk=el.dataset.sk;if(ui.qz.done[sk])break;ui.qz.sel[sk]=+el.dataset.c;
     const card=el.closest(".q");card.querySelectorAll(".ch").forEach(b=>b.classList.toggle("pick",b===el));break;}
   case "check":{const sk=el.dataset.sk;if(ui.qz.sel[sk]==null){toast("보기를 먼저 골라 주세요");break;}
     const item=ui.reg[sk],q=mcqQ(item);ui.qz.done[sk]=true;
     if(ui.qz.sel[sk]===q.a)delWrong(item.key);else addWrong(item);
     const card=el.closest(".q");card.outerHTML=mcqHTML(sk.split("|")[0],item,card.dataset.no);break;}
   case "reset":{const sk=el.dataset.sk;delete ui.qz.sel[sk];delete ui.qz.done[sk];const item=ui.reg[sk],card=el.closest(".q");card.outerHTML=mcqHTML(sk.split("|")[0],item,card.dataset.no);break;}
   case "aigen":aiGen();break;
   /* vocab */
   case "vmode":ui.vc.mode=el.dataset.m;ui.vc.ses=null;render();break;
   case "hidem":ui.vc.hideM=el.checked;render();break;
   case "showm":el.classList.toggle("show");break;
   case "vmark":{const k=el.dataset.k,v=el.dataset.v;if(S.vs[k]===v)delete S.vs[k];else S.vs[k]=v;save();
     const row=el.parentElement;row.querySelectorAll("button[data-act=vmark]").forEach(b=>{const on=S.vs[k]===b.dataset.v;b.style.borderColor=on?(b.dataset.v==="know"?"var(--ok)":"var(--warn)"):"";b.style.color=on?(b.dataset.v==="know"?"var(--ok)":"var(--warn)"):"";b.style.fontWeight=on?"700":"";});break;}
   case "vjump":openStudy(el.dataset.pid,el.dataset.w);break;
   case "vflip":ui.vc.ses.flip=!ui.vc.ses.flip;render();break;
   case "vcard":{const s=ui.vc.ses,k=s.order[s.i];S.vs[k]=el.dataset.v;save();if(el.dataset.v==="unsure")s.bad.push(k);sesNext();break;}
   case "vpick":{const s=ui.vc.ses,o=vobj(s.order[s.i]);s.pick=+el.dataset.i;const ok=s.q.opts[s.pick]===o.m;if(ok){s.ok++;delete S.vw[o.k];}else{S.vw[o.k]=1;s.bad.push(o.k);}save();render();break;}
   case "vspell":{const s=ui.vc.ses,o=vobj(s.order[s.i]),val=($("#spell").value||"").trim(),ok=val.toLowerCase()===o.w.toLowerCase();s.fb={ok:ok,val:val};if(ok){s.ok++;delete S.vw[o.k];}else{S.vw[o.k]=1;s.bad.push(o.k);}save();render();break;}
   case "vnext":sesNext();break;
   case "sesrestart":startSes();render();break;
   case "sesbad":startSes(rnd(ui.vc.ses.bad.filter((k,i,a)=>a.indexOf(k)===i)));render();break;
  }
});
document.addEventListener("change",function(e){
  const t=e.target;
  if(t.id==="qpid"){ui.qz.pid=t.value;render();}
  else if(t.id==="vfilter"){ui.vc.filter=t.value;ui.vc.ses=null;render();}
  else if(t.dataset&&t.dataset.act&&t.type==="checkbox"){/* handled in click */}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"){const t=e.target;
    if(t.id==="spell"){const b=document.querySelector("[data-act=vspell]");if(b)b.click();}
}
});
document.body.classList.toggle("hideko",!!S.hideKo);
render(true);
})();
</script>
